deptrac:
  paths:
    - ./src
  layers:
    - name: Bundle
      collectors:
        - type: classLike
          value: ^Tollbooth\\TollboothBundle$
    - name: Core
      collectors:
        - type: classLike
          value: ^Tollbooth\\Core\\.*
    - name: Auth
      collectors:
        - type: classLike
          value: ^Tollbooth\\Auth\\.*
    - name: Docs
      collectors:
        - type: classLike
          value: ^Tollbooth\\Docs\\.*
    - name: RateLimit
      collectors:
        - type: classLike
          value: ^Tollbooth\\RateLimit\\.*
    - name: Monitoring
      collectors:
        - type: classLike
          value: ^Tollbooth\\Monitoring\\.*
    - name: Health
      collectors:
        - type: classLike
          value: ^Tollbooth\\Health\\.*
    - name: Changes
      collectors:
        - type: classLike
          value: ^Tollbooth\\Changes\\.*
    - name: Dashboard
      collectors:
        - type: classLike
          value: ^Tollbooth\\Dashboard\\.*
  ruleset:
    Bundle: [Core, Auth, Docs, RateLimit, Monitoring, Health, Changes, Dashboard]
    Core: ~
    Auth: [Core]
    Docs: [Core]
    RateLimit: [Core, Auth]
    Monitoring: [Core, Auth]
    Health: [Core]
    Changes: [Core, Docs, Monitoring]
    Dashboard: [Core, Auth, Docs, RateLimit, Monitoring, Health, Changes]
